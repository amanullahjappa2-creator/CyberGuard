<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b14" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/cyberguard.svg" type="image/svg+xml" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>CyberGuard Academy</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" id="home-link" aria-label="CyberGuard Academy dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              d="M12 2.5 20 6v5.3c0 5-3.4 8.6-8 10.2-4.6-1.6-8-5.2-8-10.2V6l8-3.5Zm0 3L7 7.7v3.6c0 3.4 2.1 6 5 7.3 2.9-1.3 5-3.9 5-7.3V7.7l-5-2.2Zm-1.1 8.8-2-2 1.4-1.4 1.1 1.1 2.5-2.5 1.4 1.4-3.9 3.9-0.5-.5Z"
            />
          </svg>
        </span>
        <span>CyberGuard Academy</span>
      </a>
      <nav class="primary-nav" id="primary-nav" aria-label="Primary navigation">
        <button class="nav-link is-active" data-screen="home" data-label-key="navHome" type="button"></button>
        <button class="nav-link" data-screen="levels" data-label-key="navLevels" type="button"></button>
        <button class="nav-link" data-screen="report" data-label-key="navReport" type="button"></button>
        <button
          class="nav-link"
          data-screen="dictionary"
          data-label-key="navDictionary"
          type="button"
        ></button>
      </nav>
      <div class="toolbar">
        <details class="user-menu" id="user-menu">
          <summary class="button button-quiet" id="user-menu-trigger"></summary>
          <div class="user-menu-panel">
            <button class="menu-link" id="language-toggle" type="button">اردو</button>
            <button class="menu-link" id="theme-toggle" type="button"></button>
            <span class="menu-divider" aria-hidden="true"></span>
            <button class="menu-link" data-screen="badges" data-label-key="navBadges" type="button"></button>
            <button
              class="menu-link"
              data-screen="settings"
              data-label-key="navSettings"
              type="button"
            ></button>
            <button
              class="menu-link"
              data-screen="account"
              data-label-key="navAccount"
              type="button"
            ></button>
          </div>
        </details>
      </div>
    </header>
    <main id="app" class="app-shell" tabindex="-1">
      <div class="loading" role="status">Loading CyberGuard...</div>
    </main>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
    <footer class="site-footer">
      <span id="footer-copy"></span>
      <span id="offline-copy"></span>
    </footer>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
